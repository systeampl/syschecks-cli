# goreleaser configuration — https://goreleaser.com
# Builds the `syschecks` binary for every vX.Y.Z tag and publishes a GitHub
# Release plus a Homebrew tap formula.
#   Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: syschecks

before:
  hooks:
    - go mod tidy

builds:
  - id: syschecks
    main: .
    binary: syschecks
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/systeampl/syschecks-cli/internal/buildinfo.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Homebrew tap deferred until the systeampl/homebrew-tap repo + a cross-repo
# token exist. v0.1.0 ships GitHub Release binaries + the install script.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
